name: Commitlint

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    name: Conventional Commit subjects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit subjects
        run: |
          bad=$(git log --format=%s -n 20 \
            | grep -v '\[skip ci\]' \
            | grep -vE '^(feat|fix|perf|refactor|test|docs|chore|build|ci|release)(\([a-z0-9./-]+\))?!?: .{1,72}$' \
            || true)
          if [ -n "$bad" ]; then
            echo "These subjects do not follow Conventional Commits:"
            echo "$bad"
            exit 1
          fi
