name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Conventional Commits, so the changelog and the version bump can be derived
# from history rather than remembered. The subject line is all that is checked;
# scope and body are conventions documented in .github/COMMIT_CONVENTION.md and
# enforced by review, because a linter that fails on prose gets ignored.

jobs:
  commits:
    name: commit message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the commit subject
        run: |
          bad=$(git log --format=%s -n 20 \
            | grep -vE '^(feat|fix|perf|refactor|test|docs|chore|build|ci)(\([a-z0-9./-]+\))?!?: .{1,72}$' \
            || true)
          if [ -n "$bad" ]; then
            echo "These subjects do not follow Conventional Commits:"
            echo "$bad"
            exit 1
          fi

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the README claims, so test the floor and the tip.
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run the test suite
        run: npm test

  self:
    # The analyzer run against its own source is the closest thing to a
    # regression test available without a separate fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Analyze this repository
        run: node dist/cli.js . --format summary

      - name: The public README must not lie about its own counts
        run: |
          actual=$(NO_COLOR=1 npm test 2>&1 | sed -nE 's/.*Tests[[:space:]]+([0-9]+) passed.*/\1/p' | tail -1)
          claimed=$(grep -oP '\b[0-9]+(?= tests\b)' README.md | head -1)
          if [ "$actual" != "$claimed" ]; then
            echo "README claims $claimed tests, suite reports $actual"
            exit 1
          fi
