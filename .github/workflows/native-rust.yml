name: Native Rust

on:
  push:
    branches: [master, main]
    paths:
      - 'native/core/**'
      - 'src/native.ts'
      - 'src/cli.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-rust.yml'
  pull_request:
    paths:
      - 'native/core/**'
      - 'src/native.ts'
      - 'src/cli.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Build and test Rust worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/core/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/core/rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features
      - name: Build release worker
        run: cargo build --release
