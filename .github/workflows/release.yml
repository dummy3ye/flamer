name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v0.1.5)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-latest
    needs: publish-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Test and build
        run: |
          npm run lint
          npm run build
          npm test

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "flamerjs@$version" version >/dev/null 2>&1; then
            echo "flamerjs@$version is already published; skipping npm publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          npm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN" --location=user
          version="$(node -p "require('./package.json').version")"
          if npm view "@dummy3ye/flamerjs@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@dummy3ye/flamerjs@$version is already published; skipping."
          else
            cp package.json "$RUNNER_TEMP/package.json"
            trap 'cp "$RUNNER_TEMP/package.json" package.json' EXIT
            npm pkg set name="@dummy3ye/flamerjs"
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; skipping."
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  publish-native:
    name: Publish ${{ matrix.target }} native package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust worker
        run: cargo build --release --manifest-path native/core/rust/Cargo.toml

      - name: Build C++ worker
        run: |
          cmake -S native/core/cpp -B native/core/cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/core/cpp/build --config Release --parallel

      - name: Package native workers
        run: node scripts/package-native.mjs ${{ matrix.target }}

      - name: Publish native package
        working-directory: native/packages/${{ matrix.target }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published; skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
