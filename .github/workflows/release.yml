name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v0.1.5)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-latest
    needs: publish-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Test and build
        run: |
          npm run lint
          npm run build
          npm test

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "flamerjs@$version" version >/dev/null 2>&1; then
            echo "flamerjs@$version is already published; skipping npm publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          npm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN" --location=user
          version="$(node -p "require('./package.json').version")"
          if npm view "@dummy3ye/flamerjs@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@dummy3ye/flamerjs@$version is already published; skipping."
          else
            cp package.json "$RUNNER_TEMP/package.json"
            trap 'cp "$RUNNER_TEMP/package.json" package.json' EXIT
            npm pkg set name="@dummy3ye/flamerjs"
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if grep -n "^## \[$version\]" CHANGELOG.md >/dev/null 2>&1; then
            awk -v ver="$version" '
              /^## \[/ {
                if (found) exit
                if ($0 ~ "\\[" ver "\\]") { found=1; next }
                next
              }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md | sed '/^$/N;/^\n$/D' > "$notes_file"
          fi
          if [ ! -s "$notes_file" ]; then
            echo "See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/$RELEASE_TAG/CHANGELOG.md) for details." > "$notes_file"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; updating notes."
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

  publish-native:
    name: Publish ${{ matrix.target }} native package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust worker
        run: cargo build --release --manifest-path native/core/rust/Cargo.toml

      - name: Build C++ worker
        run: |
          cmake -S native/core/cpp -B native/core/cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/core/cpp/build --config Release --parallel

      - name: Package native workers
        run: node scripts/package-native.mjs ${{ matrix.target }} $(node -p "require('./package.json').version")

      - name: Prepare GitHub release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          target="${{ matrix.target }}"
          extension=""
          if [[ "$target" == win32-* ]]; then
            extension=".exe"
          fi
          mkdir -p release-assets
          cp "native/packages/$target/bin/flamer-core$extension" "release-assets/flamer-core-rust-$target$extension"
          cp "native/packages/$target/bin/flamer-core-cpp$extension" "release-assets/flamer-core-cpp-$target$extension"
          (cd release-assets && shasum -a 256 * > checksums-${target}.txt)

      - name: Upload native assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release-assets/flamer-core-rust-${{ matrix.target }}*
            release-assets/flamer-core-cpp-${{ matrix.target }}*
            release-assets/checksums-${{ matrix.target }}.txt
          fail_on_unmatched_files: true

      - name: Publish native package
        working-directory: native/packages/${{ matrix.target }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published; skipping."
          else
            if npm publish --provenance --access public; then
              echo "Published $package_name@$version."
            elif npm view "$package_name@$version" version >/dev/null 2>&1; then
              echo "$package_name@$version was published concurrently; continuing."
            else
              echo "Publishing $package_name@$version failed and the version is unavailable." >&2
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
