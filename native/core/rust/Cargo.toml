[package]
name = "flamer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Native performance worker for Flamer"
license = "MIT"

[lib]
name = "flamer_core"
path = "src/lib.rs"

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
